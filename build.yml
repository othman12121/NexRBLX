name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into Android layout
        run: |
          mkdir -p app/src/main/java/com/nexrblx/app
          mv ./*.kt app/src/main/java/com/nexrblx/app/ || true
          mv AndroidManifest.xml app/src/main/
          mv app.gradle.kts app/build.gradle.kts
          # bundled offline copy of the data (same file the app downloads online)
          mkdir -p app/src/main/res/raw
          cp data.json app/src/main/res/raw/nex_data.json
          for f in res__*; do
            [ -e "$f" ] || continue
            d="app/src/main/$(echo "$f" | sed 's/__/\//g')"
            mkdir -p "$(dirname "$d")"
            mv "$f" "$d"
          done
          find app -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NexRBLX-apk
          path: app/build/outputs/apk/debug/app-debug.apk
